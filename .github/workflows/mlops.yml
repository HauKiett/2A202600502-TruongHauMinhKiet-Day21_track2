name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  EVAL_THRESHOLD: "0.65"

jobs:

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn pandas joblib pyyaml pytest numpy fastapi uvicorn

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn pandas joblib pyyaml numpy "dvc[http]"

      - name: Pull data with DVC from DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_REPO: ${{ secrets.DAGSHUB_USER_REPO }}
        run: |
          set -e
          DAGSHUB_USER=$(echo "$DAGSHUB_USER_REPO" | cut -d'/' -f1)
          echo "Setting up DVC auth for user: $DAGSHUB_USER"

          dvc remote modify myremote auth basic
          dvc remote modify myremote user "$DAGSHUB_USER"
          dvc remote modify myremote password "$DAGSHUB_TOKEN"

          echo "=== DVC config ==="
          cat .dvc/config

          echo "=== Test auth with curl ==="
          curl -sf -u "$DAGSHUB_USER:$DAGSHUB_TOKEN" \
            "https://dagshub.com/$DAGSHUB_USER_REPO.dvc/" \
            -o /dev/null -w "HTTP %{http_code}\n" || echo "Auth check failed"

          echo "=== dvc pull ==="
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc -v

          echo "=== Verify data files ==="
          ls -la data/

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER_REPO }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACC"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.pkl

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACC: ${{ needs.train.outputs.accuracy }}
          THRESHOLD: ${{ env.EVAL_THRESHOLD }}
        run: |
          python - <<EOF
          import os
          acc = float(os.environ["ACC"])
          threshold = float(os.environ["THRESHOLD"])
          if acc < threshold:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < {threshold}. Block deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= {threshold}. Proceed to deploy.")
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: ./model_artifact

      - name: Setup SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          set -e

          # Debug: in length va 20 ky tu dau (an o giua bang ***)
          KEY_LEN=$(printf '%s' "$VM_SSH_KEY" | wc -c)
          echo "Secret length: $KEY_LEN chars"
          FIRST_CHARS=$(printf '%s' "$VM_SSH_KEY" | head -c 30)
          echo "First 30 chars: $FIRST_CHARS"

          # Luu raw secret de kiem tra
          printf '%s' "$VM_SSH_KEY" > /tmp/raw_secret.txt
          echo "Raw secret line count: $(wc -l < /tmp/raw_secret.txt)"

          # Thu format raw private key truoc (ho tro multi-line)
          if printf '%s' "$VM_SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "=> Format: RAW private key (OpenSSH)"
            printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          elif printf '%s' "$VM_SSH_KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "=> Format: RAW private key (RSA)"
            printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          else
            echo "=> Format: BASE64 (assumed)"
            # Chi giu lai cac ky tu base64 hop le (A-Z a-z 0-9 + / =)
            CLEANED=$(printf '%s' "$VM_SSH_KEY" | tr -cd 'A-Za-z0-9+/=')
            echo "Cleaned base64 length: $(printf '%s' "$CLEANED" | wc -c)"
            printf '%s' "$CLEANED" | base64 -d > ~/.ssh/deploy_key 2>&1 || {
              echo "Base64 decode FAILED."
              exit 1
            }
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          echo "=== Key file inspect ==="
          wc -lc ~/.ssh/deploy_key
          echo "First line: $(head -1 ~/.ssh/deploy_key)"
          echo "Last line: $(tail -1 ~/.ssh/deploy_key)"

          # Validate key bang ssh-keygen
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived.pub 2>&1 && echo "Key VALID" || {
            echo "Key INVALID:"
            cat /tmp/derived.pub
            exit 1
          }

      - name: Copy model to VM
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            model_artifact/model.pkl \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/models/model.pkl

      - name: Copy serve.py to VM
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            src/serve.py \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/src/serve.py

      - name: Restart service and health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} <<'ENDSSH'
            sudo systemctl restart mlops-serve || sudo systemctl start mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo ""
                echo "Health check PASSED."
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 3
            done
            echo "Health check FAILED after 5 attempts."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
          ENDSSH
