name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  EVAL_THRESHOLD: "0.65"

jobs:

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn pandas joblib pyyaml pytest numpy fastapi uvicorn

      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn pandas joblib pyyaml numpy "dvc[http]"

      - name: Configure DVC with DagsHub credentials
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_REPO: ${{ secrets.DAGSHUB_USER_REPO }}
        run: |
          DAGSHUB_USER=$(echo "$DAGSHUB_USER_REPO" | cut -d'/' -f1)
          dvc remote modify myremote --local auth basic
          dvc remote modify myremote --local user "$DAGSHUB_USER"
          dvc remote modify myremote --local password "$DAGSHUB_TOKEN"

      - name: Pull data with DVC
        run: |
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USER_REPO }}.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy: $ACC"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.pkl

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACC: ${{ needs.train.outputs.accuracy }}
          THRESHOLD: ${{ env.EVAL_THRESHOLD }}
        run: |
          python - <<EOF
          import os
          acc = float(os.environ["ACC"])
          threshold = float(os.environ["THRESHOLD"])
          if acc < threshold:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < {threshold}. Block deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= {threshold}. Proceed to deploy.")
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model
          path: ./model_artifact

      - name: Copy model to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "model_artifact/model.pkl"
          target: "/home/${{ secrets.VM_USER }}/models/"
          strip_components: 1

      - name: Copy serve.py to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "src/serve.py"
          target: "/home/${{ secrets.VM_USER }}/src/"
          strip_components: 1

      - name: Restart service and health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve || sudo systemctl start mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo ""
                echo "Health check PASSED."
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 3
            done
            echo "Health check FAILED after 5 attempts."
            sudo journalctl -u mlops-serve -n 50 --no-pager
            exit 1
